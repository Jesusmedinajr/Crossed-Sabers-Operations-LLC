<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossed Sabers Operations LLC | General Contracting &amp; Project Management</title>
  <style>
    :root {
      --brand-dark: #111827;
      --brand-navy: #1c2431;
      --brand-crimson: #9e1b1e;
      --brand-gold: #d4af37;
      --brand-gold-hover: #b89426;
      --text-dark: #1e293b;
      --text-muted: #475569;
      --bg-light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-dark);
      line-height: 1.6;
      background-color: #ffffff;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .navbar {
      background-color: var(--brand-dark);
      color: #ffffff;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 2px solid var(--brand-gold);
      padding: 14px 0;
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .nav-logo {
      height: 44px;
      width: auto;
      background: #ffffff;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      color: #e2e8f0;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--brand-gold);
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      text-align: center;
    }

    .btn-gold {
      background-color: var(--brand-gold);
      color: var(--brand-dark);
      border-color: var(--brand-gold);
    }

    .btn-gold:hover {
      background-color: var(--brand-gold-hover);
      border-color: var(--brand-gold-hover);
    }

    .btn-outline {
      background-color: transparent;
      color: #ffffff;
      border-color: #ffffff;
    }

    .btn-outline:hover {
      background-color: #ffffff;
      color: var(--brand-dark);
    }

    .btn-sm {
      padding: 8px 18px;
      font-size: 0.9rem;
    }

    .hero {
      background: radial-gradient(circle at top right, #263142 0%, var(--brand-dark) 65%);
      color: #ffffff;
      padding: 75px 0;
      border-bottom: 4px solid var(--brand-crimson);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      background-color: var(--brand-crimson);
      color: #ffffff;
      border: 1px solid var(--brand-gold);
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: 2.75rem;
      line-height: 1.18;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .hero p {
      font-size: 1.12rem;
      color: #cbd5e1;
      margin-bottom: 28px;
      max-width: 620px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .hero-logo-wrap {
      text-align: center;
    }

    .hero-logo {
      max-width: 270px;
      width: 100%;
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      border: 3px solid var(--brand-gold);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    .trust-strip {
      background-color: var(--bg-light);
      border-bottom: 1px solid #e2e8f0;
      padding: 24px 0;
    }

    .trust-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      text-align: center;
    }

    .trust-item strong {
      display: block;
      color: var(--brand-dark);
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .trust-item span {
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .section {
      padding: 70px 0;
    }

    .section-bg {
      background-color: var(--bg-light);
    }

    .section-header {
      text-align: center;
      max-width: 660px;
      margin: 0 auto 48px;
    }

    .section-header h2 {
      font-size: 2.1rem;
      color: var(--brand-dark);
      margin-bottom: 12px;
      font-weight: 800;
    }

    .section-header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      border: 1px solid #e2e8f0;
      border-top: 4px solid var(--brand-crimson);
    }

    .card-icon {
      width: 48px;
      height: 48px;
      background-color: rgba(158, 27, 30, 0.1);
      color: var(--brand-crimson);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.3rem;
      margin-bottom: 16px;
    }

    .card h3 {
      font-size: 1.25rem;
      color: var(--brand-dark);
      margin-bottom: 10px;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center;
    }

    .about-box {
      background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand-navy) 100%);
      color: #ffffff;
      padding: 36px;
      border-radius: 10px;
      border-left: 6px solid var(--brand-gold);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    .about-box h3 {
      color: var(--brand-gold);
      margin-bottom: 14px;
      font-size: 1.4rem;
    }

    .about-box p {
      color: #e2e8f0;
      margin-bottom: 16px;
    }

    .eyebrow {
      color: var(--brand-crimson);
      font-weight: 800;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 8px;
    }

    .about-content h2 {
      font-size: 2rem;
      color: var(--brand-dark);
      margin-bottom: 16px;
    }

    .about-content p {
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .checklist {
      list-style: none;
      margin-top: 20px;
    }

    .checklist li {
      padding: 8px 0;
      font-weight: 600;
      color: var(--brand-dark);
    }

    .checklist li::before {
      content: "✓ ";
      color: var(--brand-crimson);
      font-weight: 900;
      margin-right: 8px;
    }

    .contact-section {
      background-color: var(--brand-dark);
      color: #ffffff;
      padding: 70px 0;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 48px;
    }

    .contact-info h2 {
      font-size: 2.1rem;
      margin-bottom: 14px;
    }

    .contact-info > p {
      color: #cbd5e1;
      margin-bottom: 28px;
    }

    .info-row {
      margin-bottom: 20px;
    }

    .info-row strong {
      display: block;
      color: var(--brand-gold);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-row span, .info-row a {
      font-size: 1.05rem;
      color: #ffffff;
    }

    .form-card {
      background: #ffffff;
      color: var(--text-dark);
      padding: 32px;
      border-radius: 8px;
      border-top: 4px solid var(--brand-gold);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--brand-crimson);
    }

    footer {
      background-color: #0b0e12;
      color: #94a3b8;
      text-align: center;
      padding: 28px 0;
      border-top: 1px solid #1e293b;
      font-size: 0.9rem;
    }

    footer strong {
      color: #ffffff;
      display: block;
      margin-bottom: 6px;
    }

    @media (max-width: 860px) {
      .hero-grid,
      .cards-grid,
      .about-grid,
      .contact-grid,
      .trust-grid,
      .form-row {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 2.1rem;
      }

      .nav-links {
        display: none;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container nav-inner">
      <a href="#" class="brand">
        <img src="logo.png" alt="Crossed Sabers Operations LLC" class="nav-logo" onerror="this.style.display='none'">
        <span>CROSSED SABERS OPERATIONS LLC</span>
      </a>
      <ul class="nav-links">
        <li><a href="#services">Services</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#capabilities">Capabilities</a></li>
